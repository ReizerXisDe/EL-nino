name: Atualizar notícias do Portal VetExtensão

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar feeds e montar notícias
        run: python atualizar_noticias.py
      - name: Salvar notícias atualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza feed de notícias"
            git push
          else
            echo "Sem mudanças no feed; nada para salvar."
          fi
